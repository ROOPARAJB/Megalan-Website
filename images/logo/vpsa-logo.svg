<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="100%" height="100%">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="50%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Modern Banana & Leaf Vector Emblem -->
  <g transform="translate(6, 4)" filter="url(#subtleDrop)">
    <!-- Palm/Banana Leaf Motif -->
    <path d="M 24 50 C 8 42, 2 24, 14 6 C 26 20, 32 36, 24 50 Z" fill="url(#leafGrad)" />
    <!-- Outer Banana Curve -->
    <path d="M 18 45 C 36 42, 48 28, 50 10 C 43 22, 32 34, 18 45 Z" fill="url(#bananaGrad)" />
    <!-- Inner Accent Curve -->
    <path d="M 23 42 C 38 37, 46 23, 48 8 C 40 19, 29 30, 23 42 Z" fill="#FEF08A" opacity="0.9" />
    <!-- Stalk Base -->
    <path d="M 14 47 Q 16 52 20 52 Q 22 48 19 46 Z" fill="#713F12" />
  </g>

  <!-- Clean Brand Typography -->
  <g transform="translate(64, 10)">
    <!-- Main Brand Name -->
    <text x="0" y="24" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0F172A" letter-spacing="0.5">
      VPSA <tspan fill="#15803D">YOGA</tspan>
    </text>
    
    <!-- Subtitle: Wholesale & Cold Chain -->
    <text x="0" y="40" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#047857" letter-spacing="1.5">
      WHOLESALE &amp; COLD CHAIN LOGISTICS
    </text>
  </g>
</svg>
